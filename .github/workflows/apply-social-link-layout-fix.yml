name: Apply social link and profile layout fix

on:
  push:
    paths:
      - 'scripts/fix-social-link-inputs.py'
      - '.github/workflows/apply-social-link-layout-fix.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/event-sharing-creator-links-2026-09-07
          fetch-depth: 0
      - name: Apply patch
        run: python3 scripts/fix-social-link-inputs.py
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build production PWA
        env:
          BASE_PATH: /app/
        run: npm run build
      - name: Verify social links
        run: |
          set -euo pipefail
          grep -nF "return platformHandleUrl(platform, candidate);" src/api/profiles.js
          grep -nF "SOCIAL_LINK_ICONS" src/pages/Profile.jsx
          grep -nF "@handle or full URL" src/pages/Profile.jsx
      - name: Commit repair
        run: |
          git config user.name 'SnapMap repair'
          git config user.email 'actions@users.noreply.github.com'
          git add src/api/profiles.js src/pages/Profile.jsx
          git diff --cached --quiet && exit 0
          git commit -m 'Fix social handles and refine profile links'
          git push origin HEAD:fix/event-sharing-creator-links-2026-09-07
