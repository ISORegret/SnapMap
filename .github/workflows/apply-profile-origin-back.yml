name: Apply profile origin-aware back fix

on:
  push:
    paths:
      - 'scripts/fix-profile-origin-back.py'
      - '.github/workflows/apply-profile-origin-back.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/event-sharing-creator-links-2026-09-07
          fetch-depth: 0
      - run: python3 scripts/fix-profile-origin-back.py
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - env:
          BASE_PATH: /app/
        run: npm run build
      - name: Commit repair
        run: |
          git config user.name 'SnapMap repair'
          git config user.email 'actions@users.noreply.github.com'
          git add src/pages/Profile.jsx
          git diff --cached --quiet && exit 0
          git commit -m 'Fix profile back navigation history'
          git push origin HEAD:fix/event-sharing-creator-links-2026-09-07
