name: Apply core audit repairs

on:
  push:
    branches:
      - audit/production-hardening-2026-09-07
    paths:
      - '.github/workflows/apply-audit-core.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout audit branch
        uses: actions/checkout@v4
        with:
          ref: audit/production-hardening-2026-09-07

      - name: Apply core patch
        run: python3 scripts/audit-core-patch.py

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build repaired app
        run: npm run build

      - name: Commit repaired files
        run: |
          git config user.name "SnapMap audit"
          git config user.email "actions@users.noreply.github.com"
          git add src/App.jsx src/api/events.js src/pages/SignIn.jsx src/pages/Profile.jsx src/pages/Account.jsx
          git commit -m "Repair auth event and profile lifecycle"
          git push
