name: Apply event sharing and creator links repair

on:
  push:
    paths:
      - 'scripts/apply-event-share-links.py'
      - '.github/workflows/apply-event-share-links.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/event-sharing-creator-links-2026-09-07
          fetch-depth: 0
      - name: Apply patch
        run: python3 scripts/apply-event-share-links.py
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build production PWA
        env:
          BASE_PATH: /app/
        run: npm run build
      - name: Verify navigation and social link wiring
        run: |
          set -euo pipefail
          ! grep -nF 'Link to="/profile" className="icon-button" aria-label="Back to profile"' src/pages/Messages.jsx
          grep -nF 'Share event</button>' src/pages/EventDetail.jsx
          grep -nF 'social_links' src/api/profiles.js
          grep -nF 'SocialLinks links={profile.social_links}' src/pages/Profile.jsx
      - name: Commit repair
        run: |
          git config user.name 'SnapMap repair'
          git config user.email 'actions@users.noreply.github.com'
          git add src/pages/Messages.jsx src/pages/EventDetail.jsx src/api/profiles.js src/pages/Profile.jsx
          git diff --cached --quiet && exit 0
          git commit -m 'Fix event sharing flow and add creator links'
          git push origin HEAD:fix/event-sharing-creator-links-2026-09-07
