name: Apply contextual spot engagement

on:
  push:
    branches:
      - ui/spot-detail-contextual-engagement-2026-09-08
    paths:
      - scripts/apply-contextual-spot-engagement.py
      - .github/workflows/apply-contextual-spot-engagement.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ui/spot-detail-contextual-engagement-2026-09-08
          fetch-depth: 0
      - name: Apply contextual UI patch
        run: python scripts/apply-contextual-spot-engagement.py
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build production PWA
        env:
          BASE_PATH: /app/
        run: npm run build
      - name: Verify contextual engagement states
        shell: bash
        run: |
          set -euo pipefail
          grep -F "Rate this spot" src/pages/SpotDetail.jsx
          grep -F "Start a location discussion" src/pages/SpotDetail.jsx
          if grep -F "No check-ins yet" src/pages/SpotDetail.jsx; then
            echo "Empty check-in status still leads the spot detail"
            exit 1
          fi
          if grep -F "No ratings yet" src/pages/SpotDetail.jsx; then
            echo "Empty rating status still leads the spot detail"
            exit 1
          fi
      - name: Commit cleanup
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "SnapMap repair"
          git config user.email "actions@users.noreply.github.com"
          git add src/pages/SpotDetail.jsx docs/PRODUCT_AUDIT_2026-09-08.md
          if ! git diff --cached --quiet; then
            git commit -m "Show spot engagement contextually"
            git push origin HEAD:ui/spot-detail-contextual-engagement-2026-09-08
          fi
