name: Apply event source dedupe

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/apply-event-source-dedupe.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Collapse duplicate upstream calendar occurrences
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('supabase/functions/refresh-fccc-events/index.ts')
          text = path.read_text()

          parse_anchor = 'function parseCalendar(ics: string, now: Date) {'
          helper = '''function sourceOccurrenceIdentity(item: SourceOccurrence) {
            return `${titleKey(item.title)}|${item.startsAt}|${locationKey(item.location)}`;
          }

          function preferredSourceOccurrence(left: SourceOccurrence, right: SourceOccurrence) {
            const leftUpdated = Date.parse(left.sourceUpdatedAt || '') || 0;
            const rightUpdated = Date.parse(right.sourceUpdatedAt || '') || 0;
            if (leftUpdated !== rightUpdated) return leftUpdated > rightUpdated ? left : right;
            if (left.status !== right.status) return left.status === 'cancelled' ? left : right;
            return left.sourceKey.localeCompare(right.sourceKey) <= 0 ? left : right;
          }

          function parseCalendar(ics: string, now: Date) {'''
          if parse_anchor not in text:
              raise SystemExit('parseCalendar anchor missing')
          text = text.replace(parse_anchor, helper, 1)

          return_anchor = '  return [...occurrences.values()].sort((a, b) => a.startsAt.localeCompare(b.startsAt));'
          replacement = '''  const deduped = new Map<string, SourceOccurrence>();
            for (const item of occurrences.values()) {
              const identity = sourceOccurrenceIdentity(item);
              const current = deduped.get(identity);
              deduped.set(identity, current ? preferredSourceOccurrence(current, item) : item);
            }

            return [...deduped.values()].sort((a, b) => a.startsAt.localeCompare(b.startsAt));'''
          if return_anchor not in text:
              raise SystemExit('calendar return anchor missing')
          text = text.replace(return_anchor, replacement, 1)
          path.write_text(text)
          PY
      - name: Verify patch
        run: |
          grep -F 'sourceOccurrenceIdentity' supabase/functions/refresh-fccc-events/index.ts
          grep -F 'preferredSourceOccurrence' supabase/functions/refresh-fccc-events/index.ts
          grep -F 'const deduped = new Map<string, SourceOccurrence>();' supabase/functions/refresh-fccc-events/index.ts
      - name: Commit source fix
        shell: bash
        run: |
          git config user.name "SnapMap repair"
          git config user.email "actions@users.noreply.github.com"
          git add supabase/functions/refresh-fccc-events/index.ts
          git commit -m "Collapse duplicate calendar source occurrences"
          git push origin HEAD:main
