name: Apply navigation and identity audit repairs

on:
  push:
    branches:
      - audit/production-hardening-2026-09-07
    paths:
      - '.github/workflows/apply-audit-ui.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout audit branch
        uses: actions/checkout@v4
        with:
          ref: audit/production-hardening-2026-09-07

      - name: Apply UI patch
        run: python3 scripts/audit-ui-patch.py

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build repaired app
        run: npm run build

      - name: Commit repaired files
        run: |
          git config user.name "SnapMap audit"
          git config user.email "actions@users.noreply.github.com"
          git add src/App.jsx src/pages/Admin.jsx src/pages/SpotDetail.jsx src/pages/Privacy.jsx src/pages/About.jsx src/pages/EventDetail.jsx src/pages/Settings.jsx src/pages/Notifications.jsx src/pages/RoutePlanner.jsx src/pages/Map.jsx src/pages/Profile.jsx
          git commit -m "Harden navigation and public identity labels"
          git push
