name: Apply final web audit repairs

on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/audit-final-patch.py'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout audit branch
        uses: actions/checkout@v4
        with:
          ref: audit/production-hardening-2026-09-07
          fetch-depth: 0
      - name: Apply final patch
        run: python3 scripts/audit-final-patch.py
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Production build
        run: npm run build
      - name: Static regression checks
        shell: bash
        run: |
          set -euo pipefail
          ! grep -RInE 'TODO|FIXME|HACK|XXX' src --include='*.js' --include='*.jsx'
          RAW_BACKS=$(grep -RInF 'navigate(-1)' src --include='*.js' --include='*.jsx' | grep -v 'src/utils/navigation.js' || true)
          if [ -n "$RAW_BACKS" ]; then echo "$RAW_BACKS"; exit 1; fi
          VISIBLE_HANDLES=$(grep -RInE '>@\{|`@\$\{|>@\$\{|@\{profile\.username\}|@\{creator\.username\}' src --include='*.jsx' --include='*.js' || true)
          if [ -n "$VISIBLE_HANDLES" ]; then echo "$VISIBLE_HANDLES"; exit 1; fi
      - name: Commit repaired files
        run: |
          git config user.name 'SnapMap audit'
          git config user.email 'actions@users.noreply.github.com'
          git add src/App.jsx src/api/spots.js src/pages/Add.jsx src/pages/SpotDetail.jsx
          git diff --cached --quiet && exit 0
          git commit -m 'Finish web and iOS production hardening'
          git push origin HEAD:audit/production-hardening-2026-09-07
