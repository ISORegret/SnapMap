name: One-time photo credits patch

on:
  push:
    paths:
      - '.github/workflows/one-time-photo-credits.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Apply photographer and uploader credits
        run: python3 scripts/patch-photo-credits.py

      - name: Build
        run: |
          npm ci
          npm run build

      - name: Commit changes
        run: |
          git config user.name "SnapMap automation"
          git config user.email "actions@users.noreply.github.com"
          git add src/utils/spotImages.js src/utils/shareSpotCard.js src/pages/Add.jsx src/pages/SpotDetail.jsx
          git commit -m "Track photographer and uploader separately"
          git push
