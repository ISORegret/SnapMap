name: Public display-name fixer

on:
  push:
    paths:
      - '.github/workflows/public-name-audit.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Replace public username rendering
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          changed = set()

          def rep(path, old, new, required=False):
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  if required:
                      raise SystemExit(f'Required pattern missing in {path}: {old[:120]!r}')
                  return 0
              count = text.count(old)
              p.write_text(text.replace(old, new))
              changed.add(path)
              print(f'{path}: replaced {count} occurrence(s)')
              return count

          # Spot details: keep usernames only as internal route keys; render display names.
          rep('src/pages/SpotDetail.jsx', "  if (profile.username) return `@${profile.username}`;\n  return 'You';", "  return 'SnapMap user';", True)
          rep('src/pages/SpotDetail.jsx', '@{String(spot.createdBy).trim()}', "{String(spot.createdByDisplayName || '').trim() || (currentUserProfile?.username === String(spot.createdBy).trim() ? (currentUserProfile?.display_name || currentUserProfile?.displayName || '').trim() : '') || 'SnapMap user'}", True)
          rep('src/pages/SpotDetail.jsx', '@{String(spot.lastEditedBy).trim()}', "{(currentUserProfile?.username === String(spot.lastEditedBy).trim() ? (currentUserProfile?.display_name || currentUserProfile?.displayName || '').trim() : '') || (String(spot.createdBy || '').trim() === String(spot.lastEditedBy).trim() ? String(spot.createdByDisplayName || '').trim() : '') || 'SnapMap user'}", True)
          rep('src/pages/SpotDetail.jsx', '{author.display_name || author.username}', "{author.display_name || 'Community member'}")
          rep('src/pages/SpotDetail.jsx', "{replyTo.profile?.display_name || replyTo.profile?.username || 'comment'}", "{replyTo.profile?.display_name || 'Community member'}")

          # New spot attribution: public labels use display name, never @username.
          rep('src/pages/Add.jsx', "|| (currentUserProfile?.username ? `@${currentUserProfile.username}` : 'You');", "|| 'You';")
          rep('src/pages/Add.jsx', "|| currentUserProfile.username || '')", "|| 'SnapMap user')")
          rep('src/pages/Add.jsx', "|| `@${currentUserProfile.username}`}", "|| 'SnapMap user'}")
          rep('src/App.jsx', "createdByDisplayName: (profile.display_name || profile.displayName || '').trim() || profile.username,", "createdByDisplayName: (profile.display_name || profile.displayName || '').trim() || 'SnapMap user',")

          # Public profile page.
          rep('src/pages/Profile.jsx', 'profile.display_name || profile.username', "profile.display_name || 'SnapMap user'")
          rep('src/pages/Profile.jsx', "setEditDisplayName(profile.display_name || 'SnapMap user' || '');", "setEditDisplayName(profile.display_name || '');")
          rep('src/pages/Profile.jsx', "displayName: editDisplayName.trim() || profile.username,", "displayName: editDisplayName.trim() || 'SnapMap user',")
          rep('src/pages/Profile.jsx', "display_name: editDisplayName.trim() || profile.username,", "display_name: editDisplayName.trim() || 'SnapMap user',")
          rep('src/pages/Profile.jsx', '            <p className="text-sm text-slate-500">@{profile.username}</p>\n', '')
          rep('src/pages/Profile.jsx', 'creator.display_name || creator.username', "creator.display_name || 'SnapMap user'")
          rep('src/pages/Profile.jsx', '<p className="truncate text-xs text-slate-500">@{creator.username}</p>', '')
          rep('src/pages/Profile.jsx', '<p className="truncate text-[10px] text-slate-500">@{creator.username}</p>', '')
          rep('src/pages/Profile.jsx', "connections.outgoing.map((creator) => `@${creator.username}`).join(', ')", "connections.outgoing.map((creator) => creator.display_name || 'SnapMap user').join(', ')")

          # Explore / discovery.
          rep('src/pages/Explore.jsx', 'Try a username, name, or photography specialty.', 'Try a name or photography specialty.')
          rep('src/pages/Explore.jsx', 'creator.display_name || creator.username', "creator.display_name || 'SnapMap user'")
          rep('src/pages/Explore.jsx', '<p className="truncate text-xs text-muted">@{creator.username}</p>', '')
          rep('src/components/DiscoverSearch.jsx', 'creator.display_name || creator.username', "creator.display_name || 'SnapMap user'")
          rep('src/components/DiscoverSearch.jsx', '<p className="mt-1 truncate text-xs text-muted">@{creator.username}</p>', '')
          rep('src/components/DiscoverSearch.jsx', "post.author?.display_name || post.author?.username || 'Creator'", "post.author?.display_name || 'Creator'")

          # Messaging.
          rep('src/pages/Messages.jsx', 'profile.display_name || profile.username', "profile.display_name || 'SnapMap user'")
          rep('src/pages/Messages.jsx', 'friend.display_name || friend.username', "friend.display_name || 'SnapMap user'")
          rep('src/pages/Messages.jsx', 'profile?.display_name || profile?.username', "profile?.display_name || 'SnapMap user'")
          rep('src/pages/Messages.jsx', '<p className="truncate text-xs text-muted">@{friend.username}</p>', '')
          rep('src/pages/Messages.jsx', "{profile && <p className=\"truncate text-[11px] text-muted\">@{profile.username}</p>}", '')

          # Event UI.
          rep('src/components/EventHub.jsx', "event.host?.display_name || event.host?.username || 'Creator'", "event.host?.display_name || 'Creator'")
          rep('src/pages/EventDetail.jsx', "event.host?.display_name || event.host?.username || 'Creator'", "event.host?.display_name || 'Creator'")
          rep('src/pages/EventDetail.jsx', "item.profile?.display_name || item.profile?.username || 'Creator'", "item.profile?.display_name || 'Creator'")
          rep('src/pages/EventDetail.jsx', "rsvp.profile?.display_name || rsvp.profile?.username || 'Creator'", "rsvp.profile?.display_name || 'Creator'")
          rep('src/pages/EventDetail.jsx', "photo.post.author?.display_name || photo.post.author?.username || 'creator'", "photo.post.author?.display_name || 'creator'")
          rep('src/pages/EventDetail.jsx', "photo.post.author?.display_name || photo.post.author?.username || 'Creator'", "photo.post.author?.display_name || 'Creator'")
          rep('src/components/EventDiscussion.jsx', "item.author?.display_name || item.author?.username || 'Creator'", "item.author?.display_name || 'Creator'")

          # Feed / map / notifications.
          rep('src/components/SpotFeed.jsx', "post.author?.display_name || post.author?.username || 'a SnapMap creator'", "post.author?.display_name || 'a SnapMap creator'")
          rep('src/components/SpotFeed.jsx', "post.author?.display_name || post.author?.username || 'Creator'", "post.author?.display_name || 'Creator'")
          rep('src/components/SpotFeed.jsx', "post.author?.display_name || post.author?.username || 'a creator'", "post.author?.display_name || 'a creator'")
          rep('src/components/SpotFeed.jsx', 'item.author?.display_name || item.author?.username', "item.author?.display_name || 'Community member'")
          rep('src/pages/Map.jsx', "selectedPost.author?.display_name || selectedPost.author?.username || 'a creator'", "selectedPost.author?.display_name || 'a creator'")
          rep('src/pages/Notifications.jsx', "item.actor?.display_name || item.actor?.username || 'A creator'", "item.actor?.display_name || 'A creator'")

          # Settings can route by username internally, but the visible account label is display-name/email only.
          rep('src/pages/Settings.jsx', 'currentUserProfile.display_name || currentUserProfile.username', "currentUserProfile.display_name || 'SnapMap user'")
          rep('src/pages/Settings.jsx', 'currentUser?.email || `@${currentUserProfile.username}`', "currentUser?.email || 'Signed in'")

          print('Changed files:')
          for path in sorted(changed):
              print(' -', path)
          PY

      - name: Audit rendered username leaks
        shell: bash
        run: |
          echo 'Explicit @username render candidates:'
          grep -RIn --include='*.jsx' '@{' src || true
          echo 'Display-name fallbacks that still expose username:'
          grep -RInE --include='*.jsx' 'display_name[^\n]{0,60}\|\|[^\n]{0,60}username' src | grep -v 'src/pages/Admin.jsx' || true

      - name: Build
        run: |
          npm ci
          npm run build

      - name: Commit display-name cleanup
        shell: bash
        run: |
          git config user.name "SnapMap automation"
          git config user.email "actions@users.noreply.github.com"
          git add src
          if git diff --cached --quiet; then
            echo 'No changes to commit'
            exit 0
          fi
          git commit -m "Use display names across public UI"
          git push
