name: Apply missing profile navigation repair

on:
  push:
    paths:
      - 'scripts/fix-profile-back.py'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/production-hardening-2026-09-07
          fetch-depth: 0
      - run: python3 scripts/fix-profile-back.py
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: BASE_PATH=/app/ npm run build
      - name: Commit repair
        run: |
          git config user.name 'SnapMap audit'
          git config user.email 'actions@users.noreply.github.com'
          git add src/pages/Profile.jsx
          git commit -m 'Use safe navigation in portfolio profile'
          git push origin HEAD:audit/production-hardening-2026-09-07
