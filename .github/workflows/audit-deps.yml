name: Audit dependency hardening

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/audit-deps.yml'

permissions:
  contents: write

jobs:
  harden:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout audit branch
        uses: actions/checkout@v4
        with:
          ref: audit/production-hardening-2026-09-07
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Apply non-breaking audit fixes to lockfile
        run: npm audit fix --package-lock-only
      - name: Reinstall repaired lockfile
        run: npm ci
      - name: Production build
        run: npm run build
      - name: Reject high or critical production advisories
        run: npm audit --omit=dev --audit-level=high
      - name: Commit lockfile hardening
        run: |
          git config user.name 'SnapMap audit'
          git config user.email 'actions@users.noreply.github.com'
          git add package-lock.json
          git diff --cached --quiet && exit 0
          git commit -m 'Harden production dependencies'
          git push origin HEAD:audit/production-hardening-2026-09-07

# One-time audit workflow; removed before merging to main.
