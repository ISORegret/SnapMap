name: Apply photo challenge v1

on:
  push:
    branches:
      - feature/photo-challenges-v1
    paths:
      - .github/workflows/apply-photo-challenges-v1.yml

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/photo-challenges-v1
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Integrate challenge UI
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new, label):
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f'Missing anchor: {label} in {path}')
              p.write_text(text.replace(old, new, 1))

          replace_once(
              'src/App.jsx',
              "const MySubmissions = lazy(() => import('./pages/MySubmissions'));\n",
              "const MySubmissions = lazy(() => import('./pages/MySubmissions'));\nconst PhotoChallenge = lazy(() => import('./pages/PhotoChallenge'));\n",
              'PhotoChallenge lazy import',
          )
          replace_once(
              'src/App.jsx',
              '          <Route path="/admin" element={<Admin currentUser={currentUser} showToast={showToast} />} />\n',
              '          <Route path="/admin" element={<Admin currentUser={currentUser} showToast={showToast} />} />\n          <Route path="/challenge/:id" element={<PhotoChallenge allSpots={allSpots} currentUser={currentUser} showToast={showToast} />} />\n',
              'challenge route',
          )

          replace_once(
              'src/pages/Explore.jsx',
              "import DiscoverSearch from '../components/DiscoverSearch';\n",
              "import DiscoverSearch from '../components/DiscoverSearch';\nimport PhotoChallengeHighlight from '../components/PhotoChallengeHighlight';\n",
              'Explore challenge import',
          )
          replace_once(
              'src/pages/Explore.jsx',
              '          <>\n          <SpotFeed ',
              '          <>\n          <PhotoChallengeHighlight />\n          <SpotFeed ',
              'Community highlight',
          )

          replace_once(
              'src/pages/Map.jsx',
              "import DirectionsLauncher from '../components/DirectionsLauncher';\n",
              "import DirectionsLauncher from '../components/DirectionsLauncher';\nimport PhotoChallengeMapShortcut from '../components/PhotoChallengeMapShortcut';\n",
              'Map challenge import',
          )
          replace_once(
              'src/pages/Map.jsx',
              '    <div className="fixed inset-0 z-10 flex min-h-0 flex-col bg-page">\n',
              '    <div className="fixed inset-0 z-10 flex min-h-0 flex-col bg-page">\n      <PhotoChallengeMapShortcut />\n',
              'Map challenge shortcut',
          )

          replace_once(
              'src/pages/Admin.jsx',
              "import { fetchDiagnostics } from '../api/diagnostics';\n",
              "import { fetchDiagnostics } from '../api/diagnostics';\nimport PhotoChallengeAdminPanel from '../components/PhotoChallengeAdminPanel';\n",
              'Admin challenge import',
          )
          replace_once(
              'src/pages/Admin.jsx',
              '    <main className="mx-auto w-full max-w-4xl px-4 py-5 md:px-6">\n',
              '    <main className="mx-auto w-full max-w-4xl px-4 py-5 md:px-6">\n      <PhotoChallengeAdminPanel showToast={showToast} />\n',
              'Admin challenge panel',
          )
          PY
      - name: Bump release version
        run: npm version 2.30.0 --no-git-tag-version
      - name: Verify integration
        shell: bash
        run: |
          set -euo pipefail
          grep -F "PhotoChallenge = lazy" src/App.jsx
          grep -F 'path="/challenge/:id"' src/App.jsx
          grep -F '<PhotoChallengeHighlight />' src/pages/Explore.jsx
          grep -F '<PhotoChallengeMapShortcut />' src/pages/Map.jsx
          grep -F '<PhotoChallengeAdminPanel showToast={showToast} />' src/pages/Admin.jsx
          test -f src/pages/PhotoChallenge.jsx
          test -f src/api/photoChallenges.js
          test -f supabase/migrations/20260909201500_photo_challenges.sql
      - name: Install dependencies
        run: npm ci
      - name: Build production PWA
        env:
          BASE_PATH: /app/
        run: npm run build
      - name: Commit integration
        shell: bash
        run: |
          git config user.name "SnapMap challenge build"
          git config user.email "actions@users.noreply.github.com"
          git add src/App.jsx src/pages/Explore.jsx src/pages/Map.jsx src/pages/Admin.jsx package.json package-lock.json
          git commit -m "Integrate weekly photo challenges"
          git push origin HEAD:feature/photo-challenges-v1
