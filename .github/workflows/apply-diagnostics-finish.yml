name: Apply diagnostics completion

on:
  push:
    branches:
      - fix/diagnostics-admin-finish-2026-09-08
    paths:
      - scripts/apply-diagnostics-finish.py
      - .github/workflows/apply-diagnostics-finish.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/diagnostics-admin-finish-2026-09-08
          fetch-depth: 0
      - name: Apply diagnostics patch
        run: python scripts/apply-diagnostics-finish.py
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build production PWA
        env:
          BASE_PATH: /app/
        run: npm run build
      - name: Verify diagnostics privacy wiring
        shell: bash
        run: |
          set -euo pipefail
          grep -F "snapmap_diagnostics" src/api/diagnostics.js
          grep -F "Optional diagnostics" src/pages/Settings.jsx
          grep -F "Opt-in diagnostics" src/pages/Admin.jsx
          grep -F "recordDiagnostic('spot_view'" src/pages/SpotDetail.jsx
          if grep -E "message|search|latitude|longitude|caption|body" src/api/diagnostics.js | grep -vE "classifyDiagnosticPage|messages"; then
            echo "Review diagnostics API: user-content/location tokens found"
            exit 1
          fi
      - name: Commit repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "SnapMap repair"
          git config user.email "actions@users.noreply.github.com"
          git add src/App.jsx src/pages/Settings.jsx src/pages/SpotDetail.jsx src/pages/Admin.jsx docs/PRODUCT_AUDIT_2026-09-08.md
          if git diff --cached --quiet; then
            echo "No repair changes to commit"
          else
            git commit -m "Finish opt-in diagnostics and admin health view"
            git push origin HEAD:fix/diagnostics-admin-finish-2026-09-08
          fi
