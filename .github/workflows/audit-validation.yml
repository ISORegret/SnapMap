name: Full audit validation

on:
  push:
    branches:
      - audit/production-hardening-2026-09-07
    paths:
      - '.github/workflows/audit-validation.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout audit branch
        uses: actions/checkout@v4
        with:
          ref: audit/production-hardening-2026-09-07

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Production web build
        run: npm run build

      - name: Capacitor Android sync
        run: npm run build:android

      - name: Android debug build
        run: |
          chmod +x android/gradlew
          cd android
          ./gradlew assembleDebug --stacktrace

      - name: Repository static sweep
        if: always()
        shell: bash
        run: |
          echo '===== TODO / FIXME / HACK / XXX ====='
          grep -RInE 'TODO|FIXME|HACK|XXX' src scripts android/app/src --exclude-dir=build || true
          echo '===== Raw navigate(-1) calls ====='
          grep -RInF 'navigate(-1)' src || true
          echo '===== Visible @ / username candidates ====='
          grep -RInE '@\{|@\$\{|profile\.username|author\.username|\.username[[:space:]]*\}' src --include='*.jsx' --include='*.js' || true
          echo '===== Explicit placeholder/mock/stub markers ====='
          grep -RInEi 'not implemented|coming soon|placeholder data|mock data|temporary implementation|stub' src --include='*.jsx' --include='*.js' || true
          echo '===== Source file inventory ====='
          find src -type f \( -name '*.js' -o -name '*.jsx' \) | sort
