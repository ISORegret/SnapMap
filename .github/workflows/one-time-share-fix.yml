name: One-time spot share fix

on:
  push:
    paths:
      - '.github/workflows/one-time-share-fix.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Patch spot share flow
        run: python3 scripts/patch-spot-share.py

      - name: Build
        run: |
          npm ci
          npm run build

      - name: Commit fix
        run: |
          git config user.name "SnapMap automation"
          git config user.email "actions@users.noreply.github.com"
          git add src/pages/SpotDetail.jsx src/utils/shareSpotCard.js
          git commit -m "Share spots as one complete image"
          git push
