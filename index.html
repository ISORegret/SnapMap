<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="snapmap-icon.svg" />
    <link rel="manifest" href="manifest.webmanifest" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#080a0d" />
    <meta name="description" content="SnapMap — Find and save photography & automotive spots. Map, favorites, best times." />
    <title>SnapMap</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="splash" aria-hidden="true">
      <div class="splash-bg"></div>
      <div class="splash-content">
        <div class="splash-logo-wrap">
          <div class="splash-logo-glow"></div>
          <div class="splash-logo">
            <img src="./snapmap-icon.svg" alt="" width="80" height="80" />
          </div>
        </div>
        <h1 class="splash-title">SnapMap</h1>
        <p class="splash-tagline">The best places for photography and cars</p>
        <p class="splash-sub">Exact geo · Best times · Plan less, travel more</p>
        <div class="splash-loading">
          <div class="splash-dots">
            <span></span><span></span><span></span>
          </div>
        </div>
      </div>
    </div>
    <div id="root"></div>
    <style>
      #splash {
        position: fixed;
        inset: 0;
        z-index: 99999;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #080a0d;
        transition: opacity 0.4s ease-out, visibility 0.4s;
        font-family: 'Manrope', system-ui, -apple-system, sans-serif;
      }
      #splash.hidden {
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
      }
      .splash-bg {
        position: absolute;
        inset: 0;
        background: radial-gradient(ellipse 80% 50% at 50% 20%, rgba(246,183,60,0.14), transparent 50%),
          radial-gradient(ellipse 60% 40% at 50% 80%, rgba(75,101,140,0.09), transparent 50%);
      }
      .splash-content {
        position: relative;
        z-index: 1;
        display: flex;
        flex-direction: column;
        align-items: center;
        text-align: center;
        padding: 1.5rem;
      }
      .splash-logo-wrap {
        position: relative;
        margin-bottom: 2rem;
      }
      .splash-logo-glow {
        position: absolute;
        inset: -1rem;
        border-radius: 50%;
        background: rgba(232,167,53,0.2);
        filter: blur(24px);
      }
      .splash-logo {
        position: relative;
        width: 7rem;
        height: 7rem;
        display: flex;
        align-items: center;
        justify-content: center;
        border-radius: 1.75rem;
        border: 1px solid rgba(246,183,60,0.28);
        background: #11151b;
        box-shadow: 0 20px 70px -20px rgba(246,183,60,0.45);
      }
      .splash-logo img {
        width: 5rem;
        height: 5rem;
        object-fit: contain;
      }
      .splash-title {
        font-size: 2.25rem;
        font-weight: 700;
        letter-spacing: -0.02em;
        background: linear-gradient(135deg, #fef3c7 0%, #fcd34d 50%, #e8a735 100%);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        margin: 0;
      }
      .splash-tagline {
        margin: 0.75rem 0 0.25rem;
        font-size: 1rem;
        color: #94a3b8;
      }
      .splash-sub {
        margin: 0;
        font-size: 0.875rem;
        color: #64748b;
      }
      .splash-loading {
        margin-top: 3.5rem;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 1rem;
      }
      .splash-dots {
        display: flex;
        gap: 0.375rem;
      }
      .splash-dots span {
        width: 0.5rem;
        height: 0.5rem;
        border-radius: 50%;
        background: rgba(232,167,53,0.6);
        animation: splash-bounce 0.6s ease-in-out infinite;
      }
      .splash-dots span:nth-child(2) { animation-delay: 0.15s; }
      .splash-dots span:nth-child(3) { animation-delay: 0.3s; }
      @keyframes splash-bounce {
        0%, 100% { transform: translateY(0); }
        50% { transform: translateY(-4px); }
      }
    </style>
    <script type="module" src="/src/main.jsx"></script>
    <script>
      // The splash normally disappears as soon as React is ready. Keep a
      // standalone fallback here so a stale PWA bundle can never trap someone
      // on the loading screen indefinitely.
      window.setTimeout(function () {
        var splash = document.getElementById('splash');
        var root = document.getElementById('root');

        if (splash) {
          splash.classList.add('hidden');
          window.setTimeout(function () { splash.remove(); }, 450);
        }

        if (root && root.childElementCount === 0) {
          root.innerHTML = '<main style="box-sizing:border-box;min-height:100vh;display:grid;place-items:center;padding:24px;background:#080a0d;color:#e5e7eb;font-family:Manrope,system-ui,-apple-system,sans-serif;text-align:center"><section style="max-width:360px"><img src="./snapmap-icon.svg" alt="" width="64" height="64" style="margin-bottom:18px"><h1 style="font-size:22px;margin:0 0 10px">SnapMap couldn\'t finish loading</h1><p style="margin:0;color:#94a3b8;line-height:1.55">The installed app may have an older cached version. Refreshing the app should restore it without removing your account or saved data.</p><button id="snapmap-repair" type="button" style="margin-top:22px;border:0;border-radius:14px;background:#f6b73c;color:#211603;font:700 15px Manrope,system-ui;padding:13px 20px">Refresh SnapMap</button></section></main>';

          document.getElementById('snapmap-repair').addEventListener('click', async function () {
            try {
              if ('serviceWorker' in navigator) {
                var registrations = await navigator.serviceWorker.getRegistrations();
                await Promise.all(registrations.map(function (registration) { return registration.unregister(); }));
              }
              if ('caches' in window) {
                var cacheNames = await caches.keys();
                await Promise.all(cacheNames.map(function (name) { return caches.delete(name); }));
              }
            } finally {
              window.location.reload();
            }
          });
        }
      }, 6000);
    </script>
  </body>
</html>
